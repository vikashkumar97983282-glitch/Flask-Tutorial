<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%}My Website{% endblock %}</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; padding: 0px;}
        h2 {margin-left: 500px; margin-top: 5px;}
        header {background: #333; color: white; padding: 10px;}
        footer {background: yellow; padding: 10px; margin-top: 20px;}
        a {color: red; padding: 10px; margin: 100px; text-decoration: none;}
    </style>
</head>
<body>
    <header>
        <h2>MY BLOGS APPLICATION </h2>
        <nav>
            <a href="/">HOME</a>
            <a href="/about">ABOUT</a>
            <a href="/content">CONTENT</a>
        </nav>
    </header>
        
        {% block content %}

        {% endblock %}

    <footer>
        <p>&copy; 2026 India’s Top Blogs | Discover India’s Best Blogs, Bloggers & Trending Content.</p>
    </footer>
    
</body>
</html>
