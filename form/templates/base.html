<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Application{% endblock %}</title>
    <style>
        * {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #333;
    color: white;
    padding: 20px 0;
}

header h2 {
    text-align: center;
    margin: 10px 0 25px;
}

nav {
    color: skyblue;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 8%;
}

nav a {
    color: red;
    text-decoration: none;
    padding: 0;
    margin: 0;
}

/* This makes the content take the remaining space */
main {
    flex: 1;
}

footer {
    background: yellow;
    padding: 10px;
    margin-top: 0;
}
</style>
</head>
<body>
    <header>
        <h2>MY BLOGS APPLICATION</h2>
        <nav>
            <a href="/home">HOME</a>
            <a href="/about">ABOUT</a>
            <a href="/content">CONTENT</a>
            <a href="/blog">BLOGS</a>
            <a href="/">LOGOUT</a>
        </nav>
    </header>

    <main>
        {% block content %}

        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2026 India’s Top Blogs | Discover India’s Best Blogs, Bloggers & Trending Content.</p>
    </footer>
</body>
</html>
