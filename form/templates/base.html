<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Application{% endblock %}</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; padding: 0px;}
        header {background: #333; color: white; padding: 10px;}
        footer {background: yellow; padding: 10px; margin-top: 20px;}
        h2 {display: flex; justify-content: center; align-items: center; gap: 30px;}
        a {color: red; padding-left: 20px; margin-left: 80px; margin-bottom: 100px; text-decoration: none;}
    </style>
</head>
<body>
    <header>
        <h2>MY BLOGS APPLICATION</h2>
        <nav>
            <a href="/">HOME</a>
            <a href="/about">ABOUT</a>
            <a href="/content">CONTENT</a>
            <a href="/blog">BLOGS</a>
            <a href="/login" style="margin-left: 500px; padding-left: 40px;">LOGOUT</a>
        </nav>
    </header>

        {% block content %}

        {% endblock %}
    
    <footer>
        <p>&copy; 2026 India’s Top Blogs | Discover India’s Best Blogs, Bloggers & Trending Content.</p>
    </footer>
</body>
</html>
