{% extends "base.html" %}

{% block title %}
Placement Prediction
{% endblock %}

{% block content %}

<section class="prediction-section">

    <div class="prediction-container">

        <div class="prediction-header">

            <p class="section-label">
                MACHINE LEARNING
            </p>

            <h2>
                Predict Your
                <span>Placement Chances</span>
            </h2>

            <p>
                Enter your academic and career-related information
                to get an estimated placement prediction.
            </p>

        </div>


        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST" class="prediction-form">

            <div class="form-group">

                <label for="cgpa">
                    CGPA
                </label>

                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    placeholder="Enter your CGPA"
                    required
                >

            </div>


            <div class="form-group">

                <label for="resume">
                    RESUME SCORE
                </label>

                <input
                    type="number"
                    id="cgpa"
                    name="resume"
                    step="0.01"
                    min="0"
                    max="10"
                    placeholder="Enter your CGPA"
                    required
                >

            </div>


            <button type="submit" class="predict-button">
                Predict Placement →
            </button>

        </form>

    </div>

</section>

{% endblock %}
