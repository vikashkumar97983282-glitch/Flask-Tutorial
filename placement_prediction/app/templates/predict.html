{% extends "base.html" %}

{% block title %}
Placement Prediction
{% endblock %}

{% block content %}

<section class="prediction-section">

    <div class="prediction-container">

        <div class="prediction-header">

            <p class="section-label">
                MACHINE LEARNING
            </p>

            <h2>
                Predict Your
                <span>Placement Chances</span>
            </h2>

            <p>
                Enter your academic and career-related information
                to get an estimated placement prediction.
            </p>

        </div>


        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST" class="prediction-form">

            <div class="form-group">

                <label for="cgpa">
                    CGPA
                </label>

                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    placeholder="Enter your CGPA"
                    required
                >

            </div>


            <div class="form-group">

                <label for="internships">
                    Number of Internships
                </label>

                <input
                    type="number"
                    id="internships"
                    name="internships"
                    min="0"
                    placeholder="Enter number of internships"
                    required
                >

            </div>


            <div class="form-group">

                <label for="projects">
                    Number of Projects
                </label>

                <input
                    type="number"
                    id="projects"
                    name="projects"
                    min="0"
                    placeholder="Enter number of projects"
                    required
                >

            </div>


            <div class="form-group">

                <label for="technical_skills">
                    Technical Skills
                </label>

                <input
                    type="number"
                    id="technical_skills"
                    name="technical_skills"
                    min="0"
                    max="10"
                    placeholder="Rate your technical skills (0-10)"
                    required
                >

            </div>


            <div class="form-group">

                <label for="communication_skills">
                    Communication Skills
                </label>

                <input
                    type="number"
                    id="communication_skills"
                    name="communication_skills"
                    min="0"
                    max="10"
                    placeholder="Rate your communication skills (0-10)"
                    required
                >

            </div>


            <div class="form-group">

                <label for="certifications">
                    Certifications
                </label>

                <input
                    type="number"
                    id="certifications"
                    name="certifications"
                    min="0"
                    placeholder="Enter number of certifications"
                    required
                >

            </div>


            <button type="submit" class="predict-button">
                Predict Placement →
            </button>

        </form>

    </div>

</section>

{% endblock %}
