{% extends "base.html" %}

{% block title %}
Prediction Result
{% endblock %}

{% block content %}

<section class="result-section">

    <div class="result-card">

        <p class="section-label">
            PREDICTION RESULT
        </p>

        <h2>
            Your Placement Prediction
        </h2>

        <div class="result-value">
            {{ prediction }}
        </div>

        <p>
            This result is an estimate generated by the
            machine learning model based on the information
            you provided.
        </p>

        <a href="{{ url_for('predict.predict') }}"
           class="cta-button">
            Try Again
        </a>

    </div>

</section>

{% endblock %}
